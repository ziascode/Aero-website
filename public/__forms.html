<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aero form detection</title>
  </head>
  <body>
    <!--
      Netlify Forms deploy-time detection stub for Next.js App Router.
      Not shown to users. Field names must match the React form exactly.
      Docs: https://docs.netlify.com/forms/setup/
    -->
    <form name="service-lead" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="service-lead" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="company" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="city" type="text" />
      <input name="notes" type="text" />
      <input name="source" type="text" />
      <input name="page_path" type="text" />
    </form>
  </body>
</html>
