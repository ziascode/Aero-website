# Next.js on Netlify — OpenNext runtime is auto-injected (do not pin @netlify/plugin-nextjs).
# Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Keep Next.js App Router on the Netlify Next runtime.
# Do not add a SPA /* → /index.html redirect — it breaks SSR routes.

# Forms: static detection stub at public/__forms.html (name: service-lead).
# Z-09: After deploy → Site → Forms → Notifications → email to info@aerocleaning.ca
# Send one test submission from each service page and /book.

# Z-22: Keep staging (.netlify.app) out of the index until cutover to aerocleaning.ca.
# REMOVE this header block when the primary domain goes live.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
